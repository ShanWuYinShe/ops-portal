name: ops-portal

# ops-portal：独立统一管理站
# 与 hotspot / workwork 平级，互不嵌套。portal 本身不挂 docker.sock，
# 容器操作一律经各机 portal-agent 回连执行。
#
# 本地启动：cp .env.example .env && ./pki/dev-selfsign.sh && docker compose --profile dev up -d --build
# （--profile dev 会额外起 agent-local，本地演示 agent 心跳回连；不带的只起 nginx+backend）
# 入口：https://localhost:8443（dev 自签证书，浏览器会告警，属预期）

services:
  portal-backend:
    # 不可变版本 tag：scripts/deploy.sh 导出 IMAGE_TAG 后构建，
    # 回滚 = IMAGE_TAG=<旧tag> up -d（默认 latest 保持本地习惯）。
    image: ops-portal-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./services/portal-backend/Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
        GO_VERSION: ${GO_VERSION:-1.26.6}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
        # 前端构建标识：部署时 `UI_VERSION=$(git rev-parse --short HEAD)` 注入
        UI_VERSION: ${UI_VERSION:-dev}
    restart: unless-stopped
    init: true
    user: "1001:1001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portal_net
    environment:
      - TZ=Asia/Shanghai
      - PORTAL_BACKEND_PORT=${PORTAL_BACKEND_PORT:-8319}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - TRUSTED_PROXY_HOSTS=${TRUSTED_PROXY_HOSTS:-}
      - CERT_VERIFY_HEADER=${CERT_VERIFY_HEADER:-}
      - CERT_SERIAL_HEADER=${CERT_SERIAL_HEADER:-}
      - CERT_SUBJECT_HEADER=${CERT_SUBJECT_HEADER:-}
      - CERT_FINGERPRINT_HEADER=${CERT_FINGERPRINT_HEADER:-}
      - DEV_ALLOW_NO_CERT=${DEV_ALLOW_NO_CERT:-}
      - PORTAL_AGENT_TOKEN=${PORTAL_AGENT_TOKEN:-}
      # 机器证书包签发：调 CF 托管 CA API（token 仅服务器 IP 白名单可用）
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      # 运行调优（docs/database.md、portal-agent-protocol.md；后端 getEnv 对
      # 空串回退内置默认，.env 未设置时与原行为一致）
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-}
      - COMMAND_TTL=${COMMAND_TTL:-}
      - OPS_PROBE_INTERVAL=${OPS_PROBE_INTERVAL:-}
      # 拨测 SSRF 防线的逃生阀：仅纯内网自托管联调放开，生产留空（拒绝私网）
      - OPS_PROBE_ALLOW_PRIVATE=${OPS_PROBE_ALLOW_PRIVATE:-}
      - AGENT_OFFLINE_AFTER=${AGENT_OFFLINE_AFTER:-}
      - ALERT_COOLDOWN=${ALERT_COOLDOWN:-}
      # 门户自身告警的出站渠道（docs/portal-agent-protocol.md「心跳超时告警」；
      # 留空 = 只写审计与日志不外发）
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_SECRET=${ALERT_WEBHOOK_SECRET:-}
      # webhook 转发扫描周期（docs/webhook.md；空串由 getEnv 回退 5s）
      - WEBHOOK_DISPATCH_INTERVAL=${WEBHOOK_DISPATCH_INTERVAL:-}
      # webhook 投递保留天数（docs/webhook.md；空串由 getEnv 回退 30）
      - WEBHOOK_RETENTION_DAYS=${WEBHOOK_RETENTION_DAYS:-}
    volumes:
      # 运行期数据（portal.db/备份/service 私钥）挂仓库根 ./data：
      # .workwork/ 是 AI 中间产物目录（按约定可整体清理），不能放生产数据。
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8319/api/portal/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portal-nginx:
    image: ops-portal-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./services/portal-nginx
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.30.4}
    environment:
      # 与 portal-backend 相同的四个透传头字段名（entrypoint 自带同值默认，
      # 空串回退默认）：改 .env 时 nginx 按新名转发、backend 按新名校验，
      # 避免一处改一处没改导致的 whoami 全 403 静默断认证
      - CERT_VERIFY_HEADER=${CERT_VERIFY_HEADER:-}
      - CERT_SERIAL_HEADER=${CERT_SERIAL_HEADER:-}
      - CERT_SUBJECT_HEADER=${CERT_SUBJECT_HEADER:-}
      - CERT_FINGERPRINT_HEADER=${CERT_FINGERPRINT_HEADER:-}
    restart: unless-stopped
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      # DAC_OVERRIDE: cert 私钥 600 属宿主机 uid，容器内 root 无此 cap
      # 读不到 key（与 workwork nginx 同理，仅 master 用，worker 无 cap）。
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portal_net
    ports:
      # 同机部署时 443 已被 workwork 的 xray-forward 占用，故默认 8443；
      # 独立主机可设 PORTAL_HTTPS_PORT=443。
      - "${PORTAL_HTTPS_PORT:-8443}:443"
    volumes:
      - ./cert:/etc/nginx/certs:ro
    depends_on:
      portal-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 本地 dev 联调演示：agent 与 portal 同机，用内网直连回连。
  # 生产被管机各自独立部署 agent，不在本文件里声明。
  agent-local:
    profiles: ["dev"]
    image: ops-portal-agent:${IMAGE_TAG:-latest}
    build:
      context: ./services/portal-agent
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.6}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
    init: true
    # 非 root（镜像内建 appuser uid/gid=1001）。OrbStack 的 docker.sock 属
    # root 组（实测 srw-rw---- root root），故组补 0；Linux 被管机 sock 属
    # root:docker，见 portal-agent-compose.yml 的 group_add ${DOCKER_GID}。
    user: "1001:1001"
    group_add:
      - "0"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      # agent 自带 127.0.0.1:18080 /health 探活端点（活性）；
      # portal 连通性由 portal 侧心跳超时告警负责，不在此探测。
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portal_net
    environment:
      - TZ=Asia/Shanghai
      - PORTAL_AGENT_ID=${PORTAL_AGENT_ID:-local-dev}
      - PORTAL_AGENT_TOKEN=${PORTAL_AGENT_TOKEN:-change-me-dev-only}
      - PORTAL_URL=${PORTAL_URL:-http://portal-backend:8319}
      - PORTAL_AGENT_COMPOSE_PROJECTS=${PORTAL_AGENT_COMPOSE_PROJECTS:-ops-portal}
      - PORTAL_AGENT_SITES=${PORTAL_AGENT_SITES:-}
      - PORTAL_AGENT_DEPLOY_DIRS=${PORTAL_AGENT_DEPLOY_DIRS:-}
      - HEARTBEAT_INTERVAL=5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # deploy 需要的站点目录由各机部署文件另行挂载（见 .env.example
      # PORTAL_AGENT_DEPLOY_DIRS）；主文件不硬编码宿主机路径。
    depends_on:
      portal-backend:
        condition: service_healthy

networks:
  portal_net:
    driver: bridge
