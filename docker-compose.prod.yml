# 生产部署（服务器）：ipvlan 公网 IPv6 + Origin Pulls 强制。
# 用法：UI_VERSION=$(git rev-parse --short HEAD) docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# （UI_VERSION 注入前端构建标识，显示在侧栏底部，用于核对线上版本）
# 前置：.env 配好（见 .env.prod.example），cert/ 放 Origin CA 源站证书。

services:
  portal-nginx:
    environment:
      - OPS_DOMAIN=${OPS_DOMAIN:-ops.yinghuoren.com}
      - ORIGIN_PULL_VERIFY=on
      # 与 portal-backend 相同的透传头字段名（dev 侧同款透传，此处随 compose
      # 合并生效）；空串回退 entrypoint 默认
      - CERT_VERIFY_HEADER=${CERT_VERIFY_HEADER:-}
      - CERT_SERIAL_HEADER=${CERT_SERIAL_HEADER:-}
      - CERT_SUBJECT_HEADER=${CERT_SUBJECT_HEADER:-}
      - CERT_FINGERPRINT_HEADER=${CERT_FINGERPRINT_HEADER:-}
    networks:
      portal_net: {}
      ipvlan_docker:
        ipv6_address: "${PORTAL_IPV6:-2605:a141:2322:2623:1::30}"
    # 生产经 CF 回源，不占宿主机 443（443 已被 xray-forward 占用）
    ports: !override []

networks:
  ipvlan_docker:
    external: true
