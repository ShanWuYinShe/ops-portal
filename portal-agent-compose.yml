# 服务器 agent（被管机侧）：上报 workwork/hotspot/ops-portal/travel。
# workwork/hotspot/ops-portal 为 compose 项目（容器 + git + deploy）；
# travel 为纯静态站，无 compose 项目，仅上报 git 版本（无容器、无 deploy）。
# 独立 compose，与 portal 主文件分离，避免循环依赖。
# 用法：先把逐机 token 写入仓库根 agent-token（0600，属主 1001:1001，
# 见 volumes 注释），然后 docker compose -f portal-agent-compose.yml up -d --build
# 注意：站点目录同路径挂载（源 == 目标），deploy 解析才一致。

services:
  portal-agent:
    image: ops-portal-agent:${IMAGE_TAG:-latest}
    build:
      context: ./services/portal-agent
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.6}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
    container_name: ops-portal-agent-server
    restart: unless-stopped
    init: true
    # 非 root：镜像内建 appuser(uid/gid=1001)。agent 无写文件需求（站点目录
    # 全只读挂载，token 走 PORTAL_AGENT_TOKEN 直传），docker.sock 凭
    # group_add 的宿主 docker gid 访问（与 workwork 同做法）。
    # 前置：宿主站点目录须对 uid 1001 可读（git 上报与 deploy 读 compose 文件），
    # 不满足时 `chown -R 1001` 或调目录组权限。
    user: "1001:1001"
    group_add:
      - "${DOCKER_GID:-988}"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      # agent 自带 127.0.0.1:18080 /health 探活端点（活性）；
      # portal 连通性由 portal 侧心跳超时告警负责，不在此探测。
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai
      - PORTAL_AGENT_ID=agent-server-01
      # token 走 0600 落盘文件（./agent-token，属主 1001:1001），不经 env 直传：
      # 主 .env 的 PORTAL_AGENT_TOKEN 是 backend legacy 回退开关（须留空禁用），
      # agent 传值与它共用变量名会让「传值」被误当「开回退」，且 env 进
      # /proc 可见，文件 + 只读单文件挂载更收敛。
      - PORTAL_AGENT_TOKEN_FILE=/run/portal-agent/token
      - PORTAL_URL=http://portal-backend:8319
      - PORTAL_AGENT_COMPOSE_PROJECTS=workwork,hotspot,ops-portal
      - PORTAL_AGENT_SITES=workwork:/home/workuser/workwork,hotspot:/home/workuser/hotspot,ops-portal:/home/workuser/ops-portal,travel:/home/workuser/travel
      - PORTAL_AGENT_DEPLOY_DIRS=workwork:/home/workuser/workwork,hotspot:/home/workuser/hotspot,ops-portal:/home/workuser/ops-portal
      - HEARTBEAT_INTERVAL=10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 前置：仓库根 ./agent-token 必须已存在（0600，属主 1001:1001）——
      # bind 挂载源不存在时 docker 会建出 root 目录，agent 读 token 失败。
      # 写入：printf %s <token> > agent-token && chmod 600 agent-token
      #   && chown 1001:1001 agent-token（.gitignore 已忽略该文件）。
      - ./agent-token:/run/portal-agent/token:ro
      - /home/workuser/workwork:/home/workuser/workwork:ro
      - /home/workuser/hotspot:/home/workuser/hotspot:ro
      - /home/workuser/ops-portal:/home/workuser/ops-portal:ro
      # travel 仅 git 上报（只读挂载源码即可，无 deploy 不需要写权限）。
      # 前置：服务器 /home/workuser/travel 须已是 git checkout（先 clone 再 up，
      # 否则 docker 会建出 root 空目录导致后续 checkout 权限问题）。
      - /home/workuser/travel:/home/workuser/travel:ro
    networks:
      - ops-portal_portal_net

networks:
  ops-portal_portal_net:
    external: true
