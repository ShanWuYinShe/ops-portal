# 依赖自动更新：仅 GitHub Actions 版本。
# docker 基础镜像（Go/Alpine/Bun/Nginx）不在此列——版本由 .env.example
# 的跨仓库矩阵手工统一（与 hotspot/workwork 对齐），自动升级会造成漂移。
# Go 模块依赖升级由 govulncheck 门禁按需驱动，不走 dependabot。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 持续集成
    groups:
      actions:
        patterns:
          - "*"
