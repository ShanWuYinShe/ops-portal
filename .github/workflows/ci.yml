name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Portal Backend (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: services/portal-backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l services/portal-backend/)"
      - name: go vet
        run: go vet ./...
        working-directory: services/portal-backend
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
        working-directory: services/portal-backend
      - name: go build
        run: go build -o /dev/null .
        working-directory: services/portal-backend
      - name: go test
        run: go test -race -count=1 ./...
        working-directory: services/portal-backend
      # 依赖已知漏洞扫描（官方 vulndb）：backend 当前零发现，作为阻断门禁。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: services/portal-backend

  agent:
    name: Portal Agent (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: services/portal-agent/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l services/portal-agent/)"
      - name: go vet
        run: go vet ./...
        working-directory: services/portal-agent
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
        working-directory: services/portal-agent
      - name: go build
        run: go build -o /dev/null .
        working-directory: services/portal-agent
      - name: go test
        run: go test -race -count=1 ./...
        working-directory: services/portal-agent
      # 已接受风险（非阻断）：GO-2026-4887 / GO-2026-4883 位于 Moby 守护进程侧
      # （AuthZ 插件绕过 / 插件校验 off-by-one），agent 仅用 docker 客户端库走
      # socket 调用，漏洞代码路径不可达；且官方 Fixed in: N/A 无修复版本可升。
      # 步骤保持非阻断，新漏洞出现时仍会在此可见。
      - name: govulncheck (non-blocking, known accepted findings)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./... || true
        working-directory: services/portal-agent

  # opshttp 是发给各被管站点「拷走即用」的参考包（含验签逻辑），独立 module
  # 不被 backend/agent 镜像构建经过，必须单独门禁。零第三方依赖，无 go.sum，
  # setup-go 缓存走默认 **/go.sum 即可。
  opshttp:
    name: opshttp (reference package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l services/opshttp/)"
      - name: go vet
        run: go vet ./...
        working-directory: services/opshttp
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
        working-directory: services/opshttp
      - name: go build
        run: go build -o /dev/null .
        working-directory: services/opshttp
      - name: go test
        run: go test -race -count=1 ./...
        working-directory: services/opshttp
      # 零依赖模块只扫 stdlib：与 backend 同 Go 版本，当前应零发现，作阻断门禁。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: services/opshttp

  ui:
    name: Portal UI (SvelteKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: bun install
        run: bun install --cwd ui --frozen-lockfile
      - name: type-check (svelte-check)
        run: bun run --cwd ui check
      - name: unit test (vitest)
        run: bun run --cwd ui test
      - name: build
        run: bun run --cwd ui build

  # 单测绿不等于进程能启动：路由注册冲突（ServeMux panic）、SPA/CSP 注入
  # 这类问题只有真实镜像跑起来才暴露。构建镜像 → 起容器 → 断言对外契约。
  smoke:
    name: Container smoke (backend image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build -t ops-portal-backend:ci \
            -f services/portal-backend/Dockerfile \
            --build-arg UI_VERSION="${GITHUB_SHA::7}" \
            --build-arg GOPROXY=https://proxy.golang.org,direct .

      - name: Boot container
        run: |
          docker run -d --name smoke -p 127.0.0.1:8319:8319 \
            -e DATA_DIR=/tmp/data \
            -e DEV_ALLOW_NO_CERT=1 \
            -e TRUSTED_PROXY_CIDRS=0.0.0.0/0 \
            ops-portal-backend:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8319/api/portal/health || true)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "::error::backend did not become healthy"
          docker logs smoke
          exit 1

      - name: Assert external contract
        run: |
          set -euo pipefail
          B=http://127.0.0.1:8319
          curl -fsS "$B/api/portal/health" | grep -q '"ok":true'
          curl -fsS "$B/api/portal/whoami" | grep -q '"role":"ops.admin"'
          # 未知 GET /api/* → 404 JSON，不得回退 SPA index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/nope")" = "404"
          curl -s "$B/api/nope" | grep -q '"ok":false'
          # 未知 POST /api/* → 405（与历史行为一致）
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/api/nope")" = "405"
          # SPA 客户端路由回退 + CSP 哈希白名单已注入
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/dashboard")" = "200"
          curl -fsSI "$B/" | grep -i '^content-security-policy:' | grep -q 'sha256-'

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  # 浏览器级 E2E（Playwright，chromium）：真实水合渲染、CSP 零违规、
  # 登记证书/下发命令/审计备份闭环。对 e2e 容器（dev 免证管理员）跑。
  e2e:
    name: UI E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build -t ops-portal-backend:ci \
            -f services/portal-backend/Dockerfile \
            --build-arg UI_VERSION="${GITHUB_SHA::7}" \
            --build-arg GOPROXY=https://proxy.golang.org,direct .

      - name: Boot container
        run: |
          docker run -d --name e2e -p 127.0.0.1:8319:8319 \
            -e DATA_DIR=/tmp/data \
            -e DEV_ALLOW_NO_CERT=1 \
            -e TRUSTED_PROXY_CIDRS=0.0.0.0/0 \
            ops-portal-backend:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8319/api/portal/health || true)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "::error::backend did not become healthy"
          docker logs e2e
          exit 1

      - name: Install e2e deps + chromium
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker rm -f e2e || true
