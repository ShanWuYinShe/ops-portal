name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Portal Backend (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: services/portal-backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l services/portal-backend/)"
      - name: go vet
        run: go vet ./...
        working-directory: services/portal-backend
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
        working-directory: services/portal-backend
      - name: go build
        run: go build -o /dev/null .
        working-directory: services/portal-backend
      - name: go test
        run: go test -race -count=1 ./...
        working-directory: services/portal-backend
      # 依赖已知漏洞扫描（官方 vulndb）：backend 当前零发现，作为阻断门禁。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: services/portal-backend

  agent:
    name: Portal Agent (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: services/portal-agent/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l services/portal-agent/)"
      - name: go vet
        run: go vet ./...
        working-directory: services/portal-agent
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
        working-directory: services/portal-agent
      - name: go build
        run: go build -o /dev/null .
        working-directory: services/portal-agent
      - name: go test
        run: go test -race -count=1 ./...
        working-directory: services/portal-agent
      # 已接受风险（非阻断）：GO-2026-4887 / GO-2026-4883 位于 Moby 守护进程侧
      # （AuthZ 插件绕过 / 插件校验 off-by-one），agent 仅用 docker 客户端库走
      # socket 调用，漏洞代码路径不可达；且官方 Fixed in: N/A 无修复版本可升。
      # 步骤保持非阻断，新漏洞出现时仍会在此可见。
      - name: govulncheck (non-blocking, known accepted findings)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./... || true
        working-directory: services/portal-agent

  # opshttp 是发给各被管站点「拷走即用」的参考包（含验签逻辑），独立 module
  # 不被 backend/agent 镜像构建经过，必须单独门禁。零第三方依赖，无 go.sum，
  # setup-go 缓存走默认 **/go.sum 即可。
  opshttp:
    name: opshttp (reference package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l services/opshttp/)"
      - name: go vet
        run: go vet ./...
        working-directory: services/opshttp
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
        working-directory: services/opshttp
      - name: go build
        run: go build -o /dev/null .
        working-directory: services/opshttp
      - name: go test
        run: go test -race -count=1 ./...
        working-directory: services/opshttp
      # 零依赖模块只扫 stdlib：与 backend 同 Go 版本，当前应零发现，作阻断门禁。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: services/opshttp

  ui:
    name: Portal UI (SvelteKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: bun install
        run: bun install --cwd ui --frozen-lockfile
      - name: type-check (svelte-check)
        run: bun run --cwd ui check
      - name: unit test (vitest)
        run: bun run --cwd ui test
      - name: build
        run: bun run --cwd ui build

  # 单测绿不等于进程能启动：路由注册冲突（ServeMux panic）、SPA/CSP 注入
  # 这类问题只有真实镜像跑起来才暴露。构建镜像 → 起容器 → 断言对外契约。
  smoke:
    name: Container smoke (backend image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build -t ops-portal-backend:ci \
            -f services/portal-backend/Dockerfile \
            --build-arg UI_VERSION="${GITHUB_SHA::7}" \
            --build-arg GOPROXY=https://proxy.golang.org,direct .

      - name: Boot container
        run: |
          docker run -d --name smoke -p 127.0.0.1:8319:8319 \
            -e DATA_DIR=/tmp/data \
            -e DEV_ALLOW_NO_CERT=1 \
            -e TRUSTED_PROXY_CIDRS=0.0.0.0/0 \
            ops-portal-backend:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8319/api/portal/health || true)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "::error::backend did not become healthy"
          docker logs smoke
          exit 1

      - name: Assert external contract
        run: |
          set -euo pipefail
          B=http://127.0.0.1:8319
          curl -fsS "$B/api/portal/health" | grep -q '"ok":true'
          curl -fsS "$B/api/portal/whoami" | grep -q '"role":"ops.admin"'
          # 未知 GET /api/* → 404 JSON，不得回退 SPA index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/nope")" = "404"
          curl -s "$B/api/nope" | grep -q '"ok":false'
          # 未知 POST /api/* → 405（与历史行为一致）
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$B/api/nope")" = "405"
          # SPA 客户端路由回退 + CSP 哈希白名单已注入
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/dashboard")" = "200"
          curl -fsSI "$B/" | grep -i '^content-security-policy:' | grep -q 'sha256-'

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  # 浏览器级 E2E（Playwright，chromium）：真实水合渲染、CSP 零违规、
  # 登记证书/下发命令/审计备份闭环。对 e2e 容器（dev 免证管理员）跑。
  e2e:
    name: UI E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build -t ops-portal-backend:ci \
            -f services/portal-backend/Dockerfile \
            --build-arg UI_VERSION="${GITHUB_SHA::7}" \
            --build-arg GOPROXY=https://proxy.golang.org,direct .

      - name: Boot container
        run: |
          docker run -d --name e2e -p 127.0.0.1:8319:8319 \
            -e DATA_DIR=/tmp/data \
            -e DEV_ALLOW_NO_CERT=1 \
            -e TRUSTED_PROXY_CIDRS=0.0.0.0/0 \
            ops-portal-backend:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8319/api/portal/health || true)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "::error::backend did not become healthy"
          docker logs e2e
          exit 1

      - name: Install e2e deps + chromium
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker rm -f e2e || true

  # 静态门禁绿不等于镜像能构建：portal-nginx 在构建期在线拉 CF Origin Pull CA
  # 证书（网络/上游一动就断），portal-agent 装了 docker-cli/docker-cli-compose。
  # 各来一发真实 docker build；并各跑最小启动冒烟（nginx 用一次性自签证书，
  # agent 不接 docker.sock 也应进入心跳等待并应答 /health）。
  images:
    name: Container build & smoke (nginx & agent)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build portal-nginx image
        run: docker build -t ops-portal-nginx:ci services/portal-nginx

      - name: portal-nginx smoke
        run: |
          mkdir -p nginx-certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout nginx-certs/server_cert.key -out nginx-certs/server_cert.pem \
            -days 1 -subj "/CN=localhost"
          docker run -d --name nginx-smoke \
            --add-host portal-backend:127.0.0.1 \
            -v "$PWD/nginx-certs:/etc/nginx/certs:ro" \
            ops-portal-nginx:ci
          for i in $(seq 1 15); do
            if docker exec nginx-smoke curl -fsS http://127.0.0.1:8080/nginx-health >/dev/null 2>&1; then
              echo "nginx-health OK"; exit 0
            fi
            sleep 2
          done
          echo "::error::portal-nginx did not become healthy"
          docker logs nginx-smoke
          exit 1

      - name: Build portal-agent image
        run: |
          docker build -t ops-portal-agent:ci \
            --build-arg GOPROXY=https://proxy.golang.org,direct services/portal-agent

      - name: portal-agent smoke (boots without docker.sock)
        run: |
          docker run -d --name agent-smoke \
            -e PORTAL_AGENT_ID=ci -e PORTAL_AGENT_TOKEN=ci-token \
            -e PORTAL_URL=http://127.0.0.1:1 -e HEARTBEAT_INTERVAL=2s \
            ops-portal-agent:ci
          for i in $(seq 1 15); do
            if docker exec agent-smoke wget -q --spider http://127.0.0.1:18080/health 2>/dev/null; then
              docker exec agent-smoke id
              docker exec agent-smoke wget -qO- http://127.0.0.1:18080/health | grep -q '"ok":true'
              exit 0
            fi
            sleep 2
          done
          echo "::error::agent did not become healthy"
          docker logs agent-smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f nginx-smoke agent-smoke || true

  # 轻量静态门禁：三套 compose 编排必须可解析（变量默认值/覆盖关系、prod 的
  # external 网络声明等只有 compose config 才暴露），全部 shell 脚本过 shellcheck。
  # 部署脚本与编排文件是「全新生产部署首次启动」的入口，语法/引用错误在
  # 服务器上才爆的，全部前置到这里（ubuntu-24.04 runner 自带 shellcheck 与 docker）。
  repo-lint:
    name: Repo lint (compose config & shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config -q (base / +prod / +profile dev)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml --profile dev config -q

      - name: shellcheck (scripts/ and pki/ *.sh)
        run: shellcheck scripts/*.sh pki/*.sh

  # 秘密泄漏门禁：扫全量 git 历史（配置与 workwork 同款：默认规则集 +
  # 项目级豁免在 .gitleaks.toml；历史已甄别发现按指纹记 .gitleaksignore）。
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 全量历史扫描
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          # 仓库根没有 go.mod,不指定时缓存恢复会报 "Restore cache failed" 警告
          cache-dependency-path: services/portal-backend/go.sum
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git . -c .gitleaks.toml
